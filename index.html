<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>CV-Mister | Premium AI-Powered Resume Builder</title>
    <meta name="description" content="Create ATS-friendly, professional, and visually stunning resumes in minutes with CV-Mister. Supports RTL, multi-page PDFs, and live customization." />
    <meta name="keywords" content="resume builder, cv maker, ats resume, professional cv, arabic resume builder" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="CV-Mister | Premium Resume Builder" />
    <meta property="og:description" content="Build your next ATS-compliant, stunning resume with live preview and custom designs." />
    <meta property="og:type" content="website" />
    
    <!-- Fonts loaded via same-origin proxy to avoid CORS issues with html-to-image -->
    <script>
      (function () {
        var FONTS_URL = 'https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Merriweather:wght@300;400;700&family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@300;400;600;700;800&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap';
        fetch('/api/font-proxy?url=' + encodeURIComponent(FONTS_URL))
          .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
          .then(function (css) {
            var s = document.createElement('style');
            s.id = 'google-fonts-proxied';
            s.textContent = css;
            document.head.appendChild(s);
          })
          .catch(function () {
            // No cross-origin fallback — if the proxy fails, system fonts are used.
            // This avoids CORS errors in html-to-image when reading document.styleSheets.
            console.warn('[CV-Mister] Font proxy failed; system fonts will be used.');
          });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
